name: CI

on:
  push:
    branches: [main]
    # memory-only push は discipline ゲートを失わない — memory-discipline.yml が担保する
    paths-ignore: ['.claude/memory/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readme-check:
    # Existence + non-empty check only (no external markdown-lint action).
    # Line-count caps (README hard limit / CLAUDE.md cap) are enforced by
    # svp_pipeline/tests/discipline/, not this job.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check README files exist and are non-empty
        run: |
          test -f README.md
          grep -q '[^[:space:]]' README.md
          test -f svp_pipeline/README.md
          grep -q '[^[:space:]]' svp_pipeline/README.md

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: svp_pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: svp_pipeline/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest tests/ -q --tb=short
