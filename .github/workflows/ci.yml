name: CI

on:
  push:
    branches: [main]
    # memory-only push は discipline ゲートを失わない — memory-discipline.yml が担保する
    paths-ignore: ['.claude/memory/**']
  pull_request:

# 最小権限: 本ワークフローはリポジトリ内容の読み取りしか行わない。
permissions:
  contents: read

env:
  # Dependabot は action タグ（setup-uv）のみ更新するため、uv 本体の版は本変数で手動更新する。
  UV_VERSION: "0.13.5"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readme-check:
    # Existence + non-empty check only (no external markdown-lint action).
    # Line-count caps (README hard limit / CLAUDE.md cap) are enforced by
    # svp_pipeline/tests/discipline/, not this job.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check README files exist and are non-empty
        run: |
          test -f README.md
          grep -q '[^[:space:]]' README.md
          test -f svp_pipeline/README.md
          grep -q '[^[:space:]]' svp_pipeline/README.md

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      # setup-python が PATH に置いた matrix 版の interpreter を uv に使わせる。
      # downloads=never により、見つからない場合は別版を黙って取得せず失敗する。
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never
    defaults:
      run:
        working-directory: svp_pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      # setup-uv は v8 以降 floating な major タグを持たないため完全タグで固定する。
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      # --locked: uv.lock が pyproject.toml と食い違っていたら更新せず失敗する。
      # プロジェクト本体もインストールする（hatchling build・entry point `svp-video`・
      # presets の force-include を CI で検証するため）。build backend は uv.lock の管理外で、
      # PyPI から 7 日以上前の最新版（exclude-newer）が hash 検証なしで取得・実行される。
      - name: Install (locked)
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run --no-sync ruff check src tests

      - name: Test
        run: uv run --no-sync pytest tests/ -q --tb=short

  dependency-audit:
    # uv.lock の固定版を export した requirements（全 extras + 全 dependency group）を
    # pip-audit で既知脆弱性照合する。audit グループ（pip-audit 自身の閉包）も照合対象に含む。
    # 対象は runner プラットフォーム（Linux / 当該 CPython）に該当する行のみで、
    # win32 / darwin / emscripten 限定行は対象外。インストール環境は監査しない。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # uv export は environment marker を残したまま出力し、pip-audit（--disable-pip）が
        # 実行 interpreter に対して評価する。lock の python 版 fork（numpy 等）を
        # 網羅するよう両版で回す。
        python-version: ['3.11', '3.12']
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never
    defaults:
      run:
        working-directory: svp_pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      # pip-audit は [dependency-groups] audit（uv.lock 管理）。--only-group audit はこの
      # グループのみを導入し、プロジェクト本体は build/install しない（--no-install-project は
      # その明示。lock 外の build backend を取得・実行させない）。--locked が lock の鮮度
      # ゲートを兼ねるため、後続の export は --frozen（再 lock・鮮度確認なし）で足りる。
      - name: Install pip-audit (locked)
        run: uv sync --locked --only-group audit --no-install-project

      # --all-groups: audit グループ（pip-audit 自身の閉包。CI が実際に導入・実行する側）も
      # export に含め、照合対象から外さない。
      - name: Export locked requirements (all extras, all groups)
        run: uv export --frozen --all-extras --all-groups --no-emit-project --no-hashes -o "$RUNNER_TEMP/audit-requirements.txt"

      # --disable-pip: pip の依存解決(dry-run install)を介さず、固定版そのものを照合する。
      # --strict: 依存収集に失敗したら監査全体を失敗させる。
      - name: pip-audit
        run: uv run --no-sync pip-audit --strict --no-deps --disable-pip -r "$RUNNER_TEMP/audit-requirements.txt"
