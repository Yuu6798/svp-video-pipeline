[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "svp-pipeline"
version = "0.1.0"
description = "SVP Video Pipeline - five-layer video schema and generation pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "google-genai>=0.3",
    "openai>=1.30",
    "fal-client>=0.5",
    "httpx>=0.27",
    "numpy>=1.26",
    "pillow>=10.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
svp-video = "svp_pipeline.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pytest-mock>=3.12",
    "pytest-cov>=4.0",
]
drive = [
    "google-api-python-client>=2.120",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]

# 依存監査ツール専用 group（CI の dependency-audit job が `uv sync --only-group audit` で導入する）。
# project の extras には含めない（利用者・テスト環境へ pip-audit を混ぜない）。
[dependency-groups]
audit = ["pip-audit>=2.7,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/svp_pipeline"]

[tool.hatch.build.targets.wheel.force-include]
"src/svp_pipeline/presets" = "svp_pipeline/presets"

[tool.uv]
# 公開から 7 日未満のリリースを lock / build 依存解決の対象から外す（dependabot の
# cooldown は version-update PR にしか効かず、手動 `uv lock` は素通りするため）。
# .github/dependabot.yml の cooldown.default-days と同値（7 日）に保つ。相対指定には uv >= 0.11 が必要。
exclude-newer = "7 days"

# 公開 7 日未満の版は、それを入れないと lock に既知脆弱性が残る（pip-audit が red になる）場合に限り、
# 下記の一時 waiver でのみ lock に入れる。cutoff は修正版の公開直後の絶対時刻（UTC）で、
# 残すと当該パッケージが 7 日ルールの外で黙って固定され続けるため、削除期限を
# [tool.dependency-waivers] に併記する（tests/test_dependency_policy.py が検証する）。
[tool.uv.exclude-newer-package]
# certifi 2026.10.19: PYSEC-2026-4320 の修正版が公開 7 日未満のため一時 waiver。期限は [tool.dependency-waivers]
certifi = "2026-10-20T03:00:00Z"
# pip 26.2.2: emSign ECC Root CA - G3 を信頼する旧 certifi 同梱の修正版が公開 7 日未満のため一時 waiver。期限は [tool.dependency-waivers]
pip = "2026-10-20T16:40:00Z"
# pyasn1 0.6.5: CVE-2026-119194 ほか 3 件の修正版が公開 7 日未満のため一時 waiver。期限は [tool.dependency-waivers]
pyasn1 = "2026-10-27T06:32:50Z"

# tests/test_dependency_policy.py が参照。値 = この日までに waiver を削除して `uv lock`（超過で CI 赤）。削除可能日 = 修正版 upload + 7 日
[tool.dependency-waivers]
certifi = 2026-11-04  # 削除可能: 2026-10-28 以降
pip = 2026-11-04      # 削除可能: 2026-10-27 以降
pyasn1 = 2026-11-03   # 削除可能: 2026-11-03 06:32:50 UTC 以降

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "FA"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
